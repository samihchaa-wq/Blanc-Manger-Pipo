<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2B1330"><title>Pas de ça à table</title>
<script src="./vendor/supabase.js"></script>
<style>
:root{--n:#2B1330;--n2:#3D1D45;--ink:#1C1320;--p:#FFF8EC;--y:#FFD23F;--pink:#FF5C8A;--m:#6EE7B7;--mut:#CDB9D3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--n);color:var(--p);font-size:17px}main{max-width:540px;margin:auto;padding:20px 18px 120px}h1,h2,h3{margin:.3em 0}.muted,.hint{color:var(--mut)}.hero h1{font-size:58px;line-height:.92}.panel{background:var(--n2);padding:20px;border-radius:22px;margin:18px 0}label{display:block;color:var(--mut);margin:12px 0}input,select{width:100%;padding:13px;margin-top:6px;border:0;border-radius:12px;background:var(--p);color:var(--ink);font-size:18px}.btn{width:100%;border:0;border-radius:999px;padding:15px 18px;font-size:18px;font-weight:800;background:var(--pink);color:var(--ink);cursor:pointer}.btn.alt{background:var(--y)}.btn.ghost{background:transparent;color:var(--p);box-shadow:inset 0 0 0 2px var(--mut)}.btn:disabled{opacity:.45}.btn+.btn{margin-top:9px}.link{border:0;background:none;color:var(--mut);text-decoration:underline;padding:8px}.top{display:flex;justify-content:space-between;align-items:center}.code{font-weight:900;letter-spacing:.15em;background:var(--n2);padding:5px 10px;border-radius:8px}.scores{display:flex;gap:7px;overflow:auto;list-style:none;padding:8px 0}.scores li{white-space:nowrap;background:var(--n2);padding:6px 11px;border-radius:99px}.scores .reader{box-shadow:inset 0 0 0 2px var(--y)}.scores b{color:var(--y)}.bigcode{font-size:72px;font-weight:900;letter-spacing:.12em;color:var(--y)}.plist,.hand,.subs,.qchoices{list-style:none;padding:0}.plist li{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--n2);padding:12px 0}.tag{font-size:12px;background:var(--n2);padding:3px 7px;border-radius:6px;margin-left:6px}.ready{color:var(--m)}.qcard{background:var(--y);color:var(--ink);border-radius:18px;padding:22px 20px;font-size:25px;font-weight:800;line-height:1.22;min-height:130px;margin:15px 0}.qcard.win{background:var(--m)}.qcard.sticky{position:sticky;top:8px;z-index:2}.blank{display:inline-block;width:4em;border-bottom:4px solid var(--ink)}.fill{background:var(--pink);padding:0 .16em;border-radius:5px}.acard,.scard,.qchoice{width:100%;text-align:left;border:0;border-radius:14px;padding:16px;margin:5px 0;background:var(--p);color:var(--ink);font-size:18px;font-weight:650}.acard.sel,.scard.sel{box-shadow:0 0 0 4px var(--y)}.qchoice{background:var(--y);font-size:20px}.by{display:block;margin-top:7px;font-size:14px;font-weight:400}.dock{position:fixed;bottom:0;left:0;right:0;padding:28px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--n) 35%)}.dock>*{max-width:504px;margin-left:auto;margin-right:auto}.ranking{font-size:19px}.ranking li{padding:5px}.wheelWrap{text-align:center;padding:18px 0}.wheel{width:250px;height:250px;border-radius:50%;margin:20px auto;position:relative;background:conic-gradient(var(--pink),var(--y),var(--m),var(--pink));border:8px solid var(--p);animation:spin 1.8s cubic-bezier(.1,.7,.1,1)}.wheel:after{content:"";position:absolute;inset:42%;border-radius:50%;background:var(--n)}.pointer{font-size:36px;margin-bottom:-38px;position:relative;z-index:3}.wheelNames{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.wheelNames span{background:var(--n2);padding:5px 9px;border-radius:99px}@keyframes spin{from{transform:rotate(0)}to{transform:rotate(1260deg)}}@media(prefers-reduced-motion:reduce){.wheel{animation:none}}#toast{position:fixed;z-index:9;top:12px;left:50%;transform:translate(-50%,-160%);transition:.2s;background:var(--p);color:var(--ink);padding:12px 16px;border-radius:10px;max-width:90%}#toast.on{transform:translate(-50%,0)}
</style></head><body><main id="app"></main><div id="toast" role="status"></div><script>
const sb=supabase.createClient('https://yqfewxadpyulgxehhpcu.supabase.co','sb_publishable_Qdso-n_uVYAH1_YzjSLYlQ_rOWg93tg'),app=document.getElementById('app');let session=load(),state=null,busy=false,selected=null,picked=null,readIndex=0,last='',channel=null,poll=null,deb=null,auto=null,wheelTimer=null;
function load(){try{return JSON.parse(localStorage.getItem('pdcat'))}catch{return null}}function save(v){session=v;try{v?localStorage.setItem('pdcat',JSON.stringify(v)):localStorage.removeItem('pdcat')}catch{}}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const val=id=>(document.getElementById(id)?.value||'').trim();const P=id=>state?.players.find(p=>p.id===id),isMe=id=>id===state?.me.id,nameOf=id=>esc(P(id)?.name||'?');
function toast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3000)}async function rpc(fn,args){let{data,error}=await sb.rpc(fn,args);if(error)throw Error(error.message);return data}async function act(fn,extra={}){if(busy)return false;busy=true;render();try{await rpc(fn,{p_code:session.code,p_token:session.token,...extra});ping();await refresh(true);return true}catch(e){toast(e.message);return false}finally{busy=false;render()}}
function blank(q){return esc(q).replace('____','<span class="blank"></span>')}function fill(q,a){let i=q.indexOf('____');if(i<0)return esc(q)+' <span class="fill">'+esc(a)+'</span>';let x=a;if(i>0&&!/^[A-Z]{2}/.test(x))x=x.charAt(0).toLowerCase()+x.slice(1);return esc(q.slice(0,i))+'<span class="fill">'+esc(x)+'</span>'+esc(q.slice(i+4))}
async function refresh(force=false){if(!session)return;try{let s=await rpc('get_state',{p_code:session.code,p_token:session.token}),j=JSON.stringify(s);if(!force&&j===last)return;let changed=!state||state.room.round!==s.room.round||state.room.status!==s.room.status;state=s;last=j;if(changed){selected=null;picked=null;readIndex=0}render();scheduleAuto()}catch(e){if(/Session expirée/.test(e.message)){toast('Tu ne fais plus partie de cette partie.');leaveLocal()}}}
function connect(){disconnect();channel=sb.channel('room-'+session.code,{config:{broadcast:{self:false}}});channel.on('broadcast',{event:'bump'},()=>{clearTimeout(deb);deb=setTimeout(refresh,250)}).subscribe();poll=setInterval(()=>{if(!document.hidden)refresh()},12000)}function disconnect(){if(channel)sb.removeChannel(channel);channel=null;clearInterval(poll);clearTimeout(auto);clearTimeout(wheelTimer)}function ping(){if(channel?.state==='joined')channel.send({type:'broadcast',event:'bump',payload:{}})}function startSession(){state=null;last='';render();connect();refresh(true)}function leaveLocal(){disconnect();save(null);state=null;history.replaceState(null,'',location.pathname);render()}
function scheduleAuto(){clearTimeout(auto);clearTimeout(wheelTimer);if(!state)return;if(state.room.status==='question_select'){wheelTimer=setTimeout(render,2100);auto=setTimeout(()=>act('bot_step'),2300)}else if(state.room.status==='answering')auto=setTimeout(()=>act('bot_step'),700);else if(state.room.status==='judging'&&P(state.room.reader_id)?.is_bot)auto=setTimeout(()=>act('bot_step'),900)}
function render(){if(!session){app.innerHTML=home();return}if(!state){app.innerHTML='<p class="muted">Connexion à la partie…</p>';return}let r=state.room,v={lobby:lobby,question_select:qselect,answering:answering,judging:judging,reveal:reveal,finished:finished}[r.status];app.innerHTML=top()+v()}
function home(){let code=(new URLSearchParams(location.search).get('code')||'').toUpperCase().slice(0,4),nm='';try{nm=localStorage.getItem('pdcat-name')||''}catch{}return `<header class="hero"><h1>Pas de ça<br>à table</h1><p class="muted">Le jeu qui gâche les repas de famille.</p></header><section class="panel"><h2>Nouvelle partie</h2><label>Ton pseudo<input id="c-name" maxlength="20" value="${esc(nm)}"></label><label>Points pour gagner<select id="c-target"><option>3</option><option selected>5</option><option>7</option><option>10</option></select></label><button class="btn" data-act="create">Créer la partie</button></section><section class="panel"><h2>Rejoindre</h2><label>Code<input id="j-code" maxlength="4" value="${esc(code)}"></label><label>Ton pseudo<input id="j-name" maxlength="20" value="${esc(nm)}"></label><button class="btn alt" data-act="join">Rejoindre</button></section>`}
function top(){let r=state.room,s=r.status==='lobby'?'':`<ul class="scores">${state.players.map(p=>`<li class="${p.id===r.reader_id?'reader':''}">${esc(p.name)}${p.is_bot?' 🤖':''} <b>${p.score}</b></li>`).join('')}</ul>`;return `<div class="top"><div><span class="code">${esc(r.code)}</span>${r.round?` <span class="muted">Manche ${r.round}</span>`:''}</div><button class="link" data-act="leave">Quitter</button></div>${s}`}
function lobby(){let r=state.room,host=isMe(r.host_id),all=state.players.every(p=>p.ready),n=state.players.length;return `<p class="muted">Code de la partie</p><div class="bigcode">${esc(r.code)}</div><button class="btn ghost" data-act="share">Inviter</button><h2>Joueurs (${n}/12)</h2><ul class="plist">${state.players.map(p=>`<li><span>${esc(p.name)}${p.is_bot?'<span class="tag">BOT</span>':''}${p.id===r.host_id?'<span class="tag">hôte</span>':''}</span><span>${p.ready?'<b class="ready">PRÊT ✓</b>':'<span class="muted">pas prêt</span>'}${host&&!isMe(p.id)?` <button class="link" data-act="kick" data-id="${p.id}">Retirer</button>`:''}</span></li>`).join('')}</ul>${host?'<button class="btn ghost" data-act="bot">+ Ajouter un bot</button>':''}<p class="muted">Premier à ${r.target} points.</p><div class="dock"><button class="btn alt" data-act="ready">${state.me.ready?'Je ne suis plus prêt':'Je suis prêt'}</button>${host?`<button class="btn" data-act="start" ${n<3||!all||busy?'disabled':''}>Lancer la partie</button>`:''}</div>`}
function wheel(){return `<div class="wheelWrap"><p class="pointer">▼</p><div class="wheel"></div><h2>La roue choisit le lecteur…</h2><div class="wheelNames">${state.players.map(p=>`<span>${esc(p.name)}</span>`).join('')}</div></div>`}function qselect(){let age=Date.now()-new Date(state.room.updated_at).getTime();if(age<2000)return wheel();let reader=P(state.room.reader_id);if(reader?.is_bot)return `<div class="wheelWrap"><h2>${esc(reader.name)} est le lecteur 🤖</h2><p class="muted">Il choisit sa carte à trou…</p></div>`;if(!isMe(reader?.id))return `<div class="wheelWrap"><h2>${nameOf(reader?.id)} est le lecteur</h2><p class="muted">Il choisit une carte parmi 4…</p></div>`;return `<h2>À toi de lire</h2><p class="muted">Choisis une des 4 cartes à trou.</p><ul class="qchoices">${state.question_choices.map(q=>`<li><button class="qchoice" data-act="question" data-id="${q.id}">${blank(q.text)}</button></li>`).join('')}</ul>`}
function answering(){let r=state.room,q=state.question||'',others=state.players.filter(p=>p.id!==r.reader_id),waiting=others.filter(p=>!p.submitted);if(isMe(r.reader_id))return `<h2>Tu es le lecteur</h2><div class="qcard">${blank(q)}</div><p>${others.length-waiting.length}/${others.length} ont joué.</p><p class="muted">${waiting.length?'On attend : '+waiting.map(p=>esc(p.name)).join(', '):'Tout le monde a joué.'}</p>`;if(state.my_submission)return `<h2>Carte envoyée ✓</h2><div class="qcard">${fill(q,state.my_submission)}</div><p class="muted">${waiting.length?'On attend : '+waiting.map(p=>esc(p.name)).join(', '):'Tout le monde a joué.'}</p>`;let sel=state.hand.find(c=>c.id===selected);return `<p>${nameOf(r.reader_id)} a choisi :</p><div class="qcard sticky">${sel?fill(q,sel.text):blank(q)}</div><ul class="hand">${state.hand.map(c=>`<li><button class="acard ${c.id===selected?'sel':''}" data-act="select" data-id="${c.id}">${esc(c.text)}</button></li>`).join('')}</ul><div class="dock">${state.me.can_discard&&selected?'<button class="btn ghost" data-act="discard">Jeter cette carte</button>':''}<button class="btn" data-act="submit" ${!sel||busy?'disabled':''}>Jouer cette carte</button></div>`}
function judging(){let r=state.room,q=state.question||'',subs=state.submissions;if(!isMe(r.reader_id))return `<div class="wheelWrap"><h2>Le lecteur découvre les réponses</h2><p class="muted">${nameOf(r.reader_id)} les lit une par une…</p></div>`;if(readIndex<subs.length)return `<h2>Réponse ${readIndex+1}/${subs.length}</h2><div class="qcard">${fill(q,subs[readIndex].text)}</div><div class="dock"><button class="btn" data-act="readnext">${readIndex+1===subs.length?'Voir toutes les réponses':'Suivante'}</button></div>`;return `<h2>Laquelle gagne ?</h2><ul class="subs">${subs.map(s=>`<li><button class="scard ${s.id===picked?'sel':''}" data-act="pick" data-id="${s.id}">${fill(q,s.text)}</button></li>`).join('')}</ul><div class="dock"><button class="btn" data-act="confirm" ${!picked||busy?'disabled':''}>Choisir cette réponse</button></div>`}
function result(){let r=state.room,q=state.question||'',w=state.submissions.find(s=>s.id===r.winning_submission_id);return `<div class="qcard win">${w?fill(q,w.text):blank(q)}${w?`<span class="by">— ${esc(w.author)}</span>`:''}</div>`}function rank(){return `<ol class="ranking">${[...state.players].sort((a,b)=>b.score-a.score).map(p=>`<li>${esc(p.name)}${p.is_bot?' 🤖':''} — <b>${p.score}</b></li>`).join('')}</ol>`}
function reveal(){let r=state.room,pending=state.players.filter(p=>!p.is_bot&&p.next_ack!==r.round);return `<h2>Point pour ${nameOf(r.winner_id)} !</h2>${result()}<h3>Classement</h3>${rank()}<p class="muted">${pending.length?'On attend : '+pending.map(p=>esc(p.name)).join(', '):'Tout le monde est prêt.'}</p><div class="dock"><button class="btn" data-act="next" ${state.me.next_ack===r.round||busy?'disabled':''}>Suivant</button></div>`}
function finished(){let r=state.room;return `<h1>${isMe(r.winner_id)?'Tu gagnes !':nameOf(r.winner_id)+' gagne !'}</h1>${result()}<h3>Classement final</h3>${rank()}<p class="muted">Choisis si tu veux rester pour une nouvelle partie.</p><div class="dock"><button class="btn" data-act="continue" ${state.me.continue_requested||busy?'disabled':''}>Refaire une partie</button><button class="btn ghost" data-act="leave">Quitter</button></div>`}
async function enter(call,name){if(busy)return;busy=true;try{let d=await call();try{localStorage.setItem('pdcat-name',name)}catch{}save({code:d.code,token:d.token});history.replaceState(null,'',location.pathname+'?code='+d.code);busy=false;startSession()}catch(e){busy=false;toast(e.message)}}async function share(){let url=location.origin+location.pathname+'?code='+session.code;if(navigator.share)try{return await navigator.share({text:'Rejoins ma partie avec le code '+session.code,url})}catch{}try{await navigator.clipboard.writeText(url);toast('Lien copié.')}catch{toast(url)}}
document.addEventListener('click',async e=>{let el=e.target.closest('[data-act]');if(!el||el.disabled)return;let a=el.dataset.act,id=el.dataset.id;if(a==='create'){let n=val('c-name');if(!n)return toast('Choisis un pseudo.');return enter(()=>rpc('create_room',{p_name:n,p_target:+val('c-target')}),n)}if(a==='join'){let c=val('j-code').toUpperCase(),n=val('j-name');if(c.length!==4)return toast('Le code fait 4 caractères.');if(!n)return toast('Choisis un pseudo.');return enter(()=>rpc('join_room',{p_code:c,p_name:n}),n)}if(a==='ready')return act('set_ready',{p_ready:!state.me.ready});if(a==='bot')return act('add_bot');if(a==='start')return act('start_game');if(a==='question')return act('select_question',{p_question_id:+id});if(a==='select'){selected=+id;return render()}if(a==='discard'&&selected){if(await act('discard_card',{p_answer_id:selected}))selected=null;return}if(a==='submit'&&selected){if(await act('submit_answer',{p_answer_id:selected}))selected=null;return}if(a==='readnext'){readIndex++;return render()}if(a==='pick'){picked=id;return render()}if(a==='confirm'&&picked)return act('pick_winner',{p_submission_id:picked});if(a==='next')return act('next_round');if(a==='continue')return act('continue_game');if(a==='share')return share();if(a==='kick')return act('kick_player',{p_player_id:id});if(a==='leave'){try{await rpc('leave_room',{p_code:session.code,p_token:session.token});ping()}catch{}return leaveLocal()}});document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh(true)});let urlCode=(new URLSearchParams(location.search).get('code')||'').toUpperCase();if(session&&urlCode&&urlCode!==session.code)save(null);session?startSession():render();
</script></body></html>
