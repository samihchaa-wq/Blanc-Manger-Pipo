<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B1330">
<title>Pas de ça à table</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<style>
:root{
  --night:#2B1330; --night2:#3D1D45; --ink:#1C1320; --paper:#FFF8EC; --paper-dim:#E3D6C2;
  --yellow:#FFD23F; --pop:#FF5C8A; --pop-dark:#C43A64; --mint:#6EE7B7; --muted:#CDB9D3;
  font-family:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--paper);min-height:100%}
body{font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:18px 18px calc(120px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;line-height:1.05}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.muted{color:var(--muted)}

/* Accueil */
.hero{position:relative;padding:30px 0 6px;min-height:230px}
.deck{position:absolute;right:-4px;top:4px;width:160px;height:190px}
.deck div{position:absolute;width:122px;height:156px;border-radius:12px;padding:12px;font-size:13px;font-weight:600;line-height:1.2;color:var(--ink);box-shadow:0 12px 26px rgba(0,0,0,.4)}
.deck .d1{background:var(--yellow);transform:rotate(10deg);right:0;top:0}
.deck .d2{background:var(--paper);transform:rotate(-8deg);right:48px;top:40px}
.deck u{display:inline-block;width:3em;text-decoration:none;border-bottom:2px solid var(--ink)}
.hero h1{position:relative;z-index:1;font-size:clamp(54px,17vw,80px);font-weight:800;letter-spacing:-.035em;text-shadow:0 3px 0 var(--night)}
.lead{position:relative;z-index:1;max-width:24ch;color:var(--muted);margin:14px 0 0}
.panel{background:var(--night2);border-radius:22px;padding:20px;margin-top:18px}
.panel h2{font-size:26px;margin-bottom:14px}
label{display:block;font-size:15px;color:var(--muted);margin-bottom:14px}
input,select{display:block;width:100%;margin-top:6px;padding:13px 14px;border-radius:12px;border:0;background:var(--paper);color:var(--ink);font-size:18px;font-weight:600}
#j-code{letter-spacing:.35em;text-transform:uppercase;font-weight:800}

/* Boutons */
.btn{display:block;width:100%;border:0;border-radius:999px;padding:15px 20px;font-weight:800;font-size:18px;background:var(--pop);color:var(--ink)}
.btn.alt{background:var(--yellow)}
.btn.ghost{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 2px var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn + .btn{margin-top:10px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:8px;font-size:15px}

/* Barre du haut */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.code{font-weight:800;letter-spacing:.15em;background:var(--night2);padding:4px 10px;border-radius:8px;margin-right:8px}
.scores{list-style:none;margin:0 -18px 16px;padding:0 18px 4px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.scores::-webkit-scrollbar{display:none}
.scores li{flex:none;display:flex;gap:7px;align-items:center;background:var(--night2);border-radius:999px;padding:6px 13px;font-size:15px;white-space:nowrap}
.scores li.reader{box-shadow:inset 0 0 0 2px var(--yellow)}
.scores li.done::before{content:"✓";color:var(--mint);font-weight:800}
.scores b{color:var(--yellow)}

/* Cartes */
.role{font-size:20px;font-weight:600;margin:4px 0 14px}
.qcard{background:var(--yellow);color:var(--ink);border-radius:18px;padding:22px 20px 26px;font-size:clamp(22px,6.4vw,28px);font-weight:800;line-height:1.22;letter-spacing:-.01em;box-shadow:0 14px 30px rgba(0,0,0,.4);transform:rotate(-1.2deg);min-height:140px}
.qcard.sticky{position:sticky;top:10px;z-index:3}
.qcard.win{background:var(--mint)}
.blank{display:inline-block;width:4.2em;border-bottom:4px solid var(--ink);margin:0 .08em}
.fill{background:var(--pop);color:var(--ink);padding:0 .18em;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.deal{animation:deal .5s cubic-bezier(.2,.8,.3,1.15)}
@keyframes deal{from{transform:translateY(-40px) rotate(-10deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.deal{animation:none}}

.hand,.subs{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:10px}
.acard,.scard{display:block;width:100%;text-align:left;background:var(--paper);color:var(--ink);border:0;border-radius:14px;padding:16px 18px;font-size:19px;font-weight:600;line-height:1.3}
.acard{box-shadow:0 3px 0 var(--paper-dim);transition:transform .12s,background .12s}
.acard.sel{background:var(--pop);transform:translateX(8px) rotate(.8deg);box-shadow:0 3px 0 var(--pop-dark)}
.scard.sel{box-shadow:0 0 0 4px var(--yellow)}
.scard .by{display:block;font-size:15px;color:#6E5C74;margin-top:6px;font-weight:400}
.scard.won{background:var(--mint)}

/* Salon */
.bigcode{font-size:76px;font-weight:800;letter-spacing:.12em;color:var(--yellow);margin:2px 0 16px}
.sec{font-size:22px;margin:26px 0 6px}
.plist{list-style:none;padding:0;margin:0 0 16px}
.plist li{display:flex;justify-content:space-between;align-items:center;min-height:52px;border-bottom:1px solid var(--night2);font-size:19px;font-weight:600}
.tag{font-size:13px;background:var(--night2);color:var(--muted);border-radius:6px;padding:2px 8px;margin-left:8px;font-weight:400}
.notice{background:var(--night2);border-radius:14px;padding:12px 14px;margin:0 0 14px}
.bigwin{font-size:clamp(40px,12vw,56px);font-weight:800;letter-spacing:-.03em;margin:4px 0 18px;color:var(--yellow)}
.ranking{padding-left:1.4em;font-size:19px;font-weight:600}
.ranking li{padding:6px 0}

/* Bas d'écran */
.dock{position:fixed;left:0;right:0;bottom:0;padding:24px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--night) 65%,rgba(43,19,48,0))}
.dock > *{max-width:484px;margin-left:auto;margin-right:auto}
.hint{text-align:center;color:var(--muted);margin:0 auto}
.center{text-align:center;padding-top:30vh}

#toast{position:fixed;left:50%;top:12px;transform:translate(-50%,-160%);background:var(--paper);color:var(--ink);padding:12px 18px;border-radius:12px;font-weight:600;transition:transform .25s;z-index:10;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const SB_URL = 'https://yqfewxadpyulgxehhpcu.supabase.co';
const SB_KEY = 'sb_publishable_Qdso-n_uVYAH1_YzjSLYlQ_rOWg93tg';
const sb = supabase.createClient(SB_URL, SB_KEY);
const app = document.getElementById('app');

let session = load();
let state = null, lastJson = '', roundKey = '', dealPending = false;
let selected = null, picked = null, busy = false;
let channel = null, pollTimer = null, pendingPing = false, refreshDebounce = null;

function load(){ try { return JSON.parse(localStorage.getItem('pdcat')) } catch { return null } }
function save(s){ session = s; try { s ? localStorage.setItem('pdcat', JSON.stringify(s)) : localStorage.removeItem('pdcat') } catch {} }
function savedName(){ try { return localStorage.getItem('pdcat-name') || '' } catch { return '' } }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = id => (document.getElementById(id)?.value || '').trim();

function blank(q){ return esc(q).replace('____', '<span class="blank"></span>') }
function fill(q, a){
  const i = q.indexOf('____');
  if (i < 0) return esc(q) + ' <span class="fill">' + esc(a) + '</span>';
  let ans = a;
  if (i > 0 && !/^[A-Z]{2}/.test(ans)) ans = ans.charAt(0).toLowerCase() + ans.slice(1);
  return esc(q.slice(0, i)) + '<span class="fill">' + esc(ans) + '</span>' + esc(q.slice(i + 4));
}

function toast(m){
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 3500);
}

async function rpc(fn, args){
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw new Error(error.message);
  return data;
}

async function act(fn, extra = {}){
  if (busy) return false;
  busy = true; render();
  let ok = false;
  try {
    await rpc(fn, { p_code: session.code, p_token: session.token, ...extra });
    ok = true; ping(); await refresh(true);
  } catch (e) { toast(e.message) }
  busy = false; render();
  return ok;
}

async function refresh(force){
  if (!session) return;
  try {
    const s = await rpc('get_state', { p_code: session.code, p_token: session.token });
    const j = JSON.stringify(s);
    if (!force && j === lastJson) return;
    lastJson = j;
    const key = s.room.status + ':' + s.room.round;
    if (key !== roundKey) {
      if (s.room.status === 'answering' && !roundKey.endsWith(':' + s.room.round)) dealPending = true;
      selected = null; picked = null; roundKey = key;
    }
    state = s; render();
  } catch (e) {
    if (/Session expirée/.test(e.message)) { toast('Tu ne fais plus partie de cette partie.'); leaveLocal(); }
  }
}

function scheduleRefresh(){
  clearTimeout(refreshDebounce);
  refreshDebounce = setTimeout(() => refresh(), 400);
}

function connect(){
  disconnect();
  channel = sb.channel('room-' + session.code, { config: { broadcast: { self: false } } });
  channel.on('broadcast', { event: 'bump' }, scheduleRefresh).subscribe(st => {
    if (st === 'SUBSCRIBED' && pendingPing) { pendingPing = false; ping(); }
  });
  pollTimer = setInterval(() => { if (!document.hidden) refresh() }, 15000);
}
function disconnect(){
  if (channel) { sb.removeChannel(channel); channel = null }
  clearInterval(pollTimer);
  clearTimeout(refreshDebounce);
}
function ping(){
  if (channel && channel.state === 'joined') channel.send({ type: 'broadcast', event: 'bump', payload: {} });
  else pendingPing = true;
}

function startSession(){
  state = null; lastJson = ''; roundKey = '';
  render(); connect(); refresh(true);
}
function leaveLocal(){
  disconnect(); save(null); state = null;
  history.replaceState(null, '', location.pathname);
  render();
}

/* ---------- Vues ---------- */
function render(){
  if (!session) { app.innerHTML = homeView(); return }
  if (!state) { app.innerHTML = '<p class="center muted">Connexion à la partie…</p>'; return }
  const r = state.room;
  const views = { lobby: lobbyView, answering: answeringView, judging: judgingView, reveal: revealView, finished: finishedView };
  app.innerHTML = topbar() + views[r.status]();
  dealPending = false;
}

const P = id => state.players.find(p => p.id === id);
const nameOf = id => esc(P(id)?.name || '?');
const isMe = id => id === state.me.id;
const dis = cond => (cond || busy) ? 'disabled' : '';

function homeView(){
  const code = (new URLSearchParams(location.search).get('code') || '').toUpperCase().slice(0, 4);
  const name = esc(savedName());
  const create = `
    <section class="panel">
      <h2>Nouvelle partie</h2>
      <label>Ton pseudo<input id="c-name" maxlength="20" autocomplete="nickname" value="${name}"></label>
      <label>Points pour gagner
        <select id="c-target"><option>3</option><option selected>5</option><option>7</option><option>10</option></select>
      </label>
      <button class="btn" data-act="create">Créer la partie</button>
    </section>`;
  const join = `
    <section class="panel">
      <h2>Rejoindre une partie</h2>
      <label>Code de la partie<input id="j-code" maxlength="4" autocapitalize="characters" autocomplete="off" value="${esc(code)}"></label>
      <label>Ton pseudo<input id="j-name" maxlength="20" autocomplete="nickname" value="${name}"></label>
      <button class="btn alt" data-act="join">Rejoindre</button>
    </section>`;
  return `
    <header class="hero">
      <div class="deck" aria-hidden="true">
        <div class="d1">Mon talent caché : <u></u>.</div>
        <div class="d2">Un poney dépressif</div>
      </div>
      <h1>Pas de ça<br>à table</h1>
      <p class="lead">Le jeu de cartes qui gâche les repas de famille. De 3 à 12 joueurs, un téléphone chacun.</p>
    </header>
    ${code ? join + create : create + join}`;
}

function topbar(){
  const r = state.room;
  const scores = r.status === 'lobby' ? '' : `
    <ul class="scores" aria-label="Scores">
      ${state.players.map(p => `<li class="${p.id === r.reader_id && r.status !== 'finished' ? 'reader' : ''} ${p.submitted && r.status === 'answering' ? 'done' : ''}">
        <span>${esc(p.name)}${isMe(p.id) ? ' (toi)' : ''}</span><b>${p.score}</b></li>`).join('')}
    </ul>`;
  return `
    <div class="top">
      <div><span class="code">${esc(r.code)}</span>${r.round > 0 && r.status !== 'lobby' ? `<span class="muted">Tour ${r.round}</span>` : ''}</div>
      <button class="link" data-act="leave">Quitter</button>
    </div>${scores}`;
}

function lobbyView(){
  const r = state.room, n = state.players.length, host = isMe(r.host_id);
  const paused = r.round > 0
    ? `<p class="notice">Partie en pause : il faut au moins 3 joueurs. Les scores sont conservés.</p>` : '';
  const dock = host
    ? (n < 3 ? `<p class="hint">Il manque ${3 - n} joueur${3 - n > 1 ? 's' : ''} pour lancer.</p>`
             : `<button class="btn" data-act="start" ${dis()}>${r.round > 0 ? 'Reprendre la partie' : 'Lancer la partie'}</button>`)
    : `<p class="hint">${nameOf(r.host_id)} lancera la partie.</p>`;
  return `
    ${paused}
    <p class="muted" style="margin:0">Code de la partie</p>
    <div class="bigcode">${esc(r.code)}</div>
    <button class="btn ghost" data-act="share">Inviter des joueurs</button>
    <h2 class="sec">Joueurs (${n}/12)</h2>
    <ul class="plist">
      ${state.players.map(p => `<li>
        <span>${esc(p.name)}${p.id === r.host_id ? '<span class="tag">hôte</span>' : ''}${isMe(p.id) ? '<span class="tag">toi</span>' : ''}</span>
        ${host && !isMe(p.id) ? `<button class="link" data-act="kick" data-id="${p.id}">Retirer</button>` : ''}
      </li>`).join('')}
    </ul>
    <p class="muted">Premier à ${r.target} point${r.target > 1 ? 's' : ''}.</p>
    <div class="dock">${dock}</div>`;
}

function answeringView(){
  const r = state.room, q = state.question || '';
  const others = state.players.filter(p => p.id !== r.reader_id);
  const done = others.filter(p => p.submitted).length;
  const deal = dealPending ? ' deal' : '';

  if (isMe(r.reader_id)) {
    const waiting = others.filter(p => !p.submitted).map(p => esc(p.name)).join(', ');
    return `
      <p class="role">C'est toi qui lis. Lis la question à voix haute.</p>
      <div class="qcard${deal}">${blank(q)}</div>
      <p class="muted" style="margin-top:18px">${done}/${others.length} réponses reçues${waiting ? '. On attend : ' + waiting + '.' : '.'}</p>
      <div class="dock">
        ${done === 0 ? `<button class="btn ghost" data-act="skip" ${dis()}>Changer de question</button>` : ''}
        ${done > 0 ? `<button class="btn" data-act="force" ${dis()}>Lire les réponses sans attendre</button>` : ''}
      </div>`;
  }

  if (state.my_submission) {
    const waiting = others.filter(p => !p.submitted).map(p => esc(p.name)).join(', ');
    return `
      <p class="role">Carte jouée.</p>
      <div class="qcard${deal}">${fill(q, state.my_submission)}</div>
      <p class="muted" style="margin-top:18px">${waiting ? 'On attend : ' + waiting + '.' : 'Toutes les réponses sont là.'}</p>`;
  }

  const sel = state.hand.find(c => c.id === selected);
  return `
    <p class="role">${nameOf(r.reader_id)} lit la question. Choisis ta meilleure réponse.</p>
    <div class="qcard sticky${deal}">${sel ? fill(q, sel.text) : blank(q)}</div>
    <ul class="hand">
      ${state.hand.map(c => `<li><button class="acard ${c.id === selected ? 'sel' : ''}" data-act="select" data-id="${c.id}" aria-pressed="${c.id === selected}">${esc(c.text)}</button></li>`).join('')}
    </ul>
    <div class="dock"><button class="btn" data-act="submit" ${dis(!sel)}>${sel ? 'Jouer cette carte' : 'Touche une carte'}</button></div>`;
}

function judgingView(){
  const r = state.room, q = state.question || '';
  if (isMe(r.reader_id)) {
    return `
      <p class="role">Lis chaque réponse à voix haute, puis touche la plus drôle.</p>
      <ol class="subs">
        ${state.submissions.map(s => `<li><button class="scard ${s.id === picked ? 'sel' : ''}" data-act="pick" data-id="${s.id}" aria-pressed="${s.id === picked}">${fill(q, s.text)}</button></li>`).join('')}
      </ol>
      <div class="dock"><button class="btn" data-act="confirm" ${dis(!picked)}>${picked ? 'Donner le point' : 'Touche ta réponse préférée'}</button></div>`;
  }
  return `
    <p class="role">${nameOf(r.reader_id)} lit les réponses et choisit la plus drôle.</p>
    <ol class="subs">
      ${state.submissions.map(s => `<li><div class="scard">${fill(q, s.text)}</div></li>`).join('')}
    </ol>`;
}

function resultList(){
  const r = state.room, q = state.question || '';
  const win = state.submissions.find(s => s.id === r.winning_submission_id);
  const rest = state.submissions.filter(s => s.id !== r.winning_submission_id);
  return `
    <div class="qcard win">${win ? fill(q, win.text) : blank(q)}</div>
    ${rest.length ? `<h3 class="sec">Les autres réponses</h3>
    <ul class="subs">${rest.map(s => `<li><div class="scard">${fill(q, s.text)}<span class="by">${esc(s.author)}</span></div></li>`).join('')}</ul>` : ''}`;
}

function revealView(){
  const r = state.room;
  const canNext = isMe(r.reader_id) || isMe(r.host_id);
  return `
    <p class="role">Point pour ${isMe(r.winner_id) ? 'toi' : nameOf(r.winner_id)} !</p>
    ${resultList()}
    <div class="dock">${canNext
      ? `<button class="btn" data-act="next" ${dis()}>Tour suivant</button>`
      : `<p class="hint">${nameOf(r.reader_id)} lance le tour suivant.</p>`}</div>`;
}

function finishedView(){
  const r = state.room;
  const ranked = [...state.players].sort((a, b) => b.score - a.score);
  return `
    <p class="muted" style="margin:0">Partie terminée</p>
    <h1 class="bigwin">${isMe(r.winner_id) ? 'Tu gagnes !' : nameOf(r.winner_id) + ' gagne !'}</h1>
    ${resultList()}
    <h3 class="sec">Classement</h3>
    <ol class="ranking">${ranked.map(p => `<li>${esc(p.name)} : ${p.score} pt${p.score > 1 ? 's' : ''}</li>`).join('')}</ol>
    <div class="dock">${isMe(r.host_id)
      ? `<button class="btn" data-act="start" ${dis()}>Rejouer</button>`
      : `<p class="hint">${nameOf(r.host_id)} peut relancer une partie.</p>`}</div>`;
}

/* ---------- Actions ---------- */
async function enter(call, name){
  if (busy) return;
  busy = true;
  app.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    const d = await call();
    try { localStorage.setItem('pdcat-name', name) } catch {}
    save({ code: d.code, token: d.token });
    history.replaceState(null, '', location.pathname + '?code=' + d.code);
    pendingPing = true;
    busy = false;
    startSession();
  } catch (e) {
    toast(e.message);
    busy = false;
    app.querySelectorAll('button').forEach(b => b.disabled = false);
  }
}

async function share(){
  const url = location.origin + location.pathname + '?code=' + session.code;
  const text = `Rejoins ma partie de « Pas de ça à table » avec le code ${session.code}`;
  if (navigator.share) { try { await navigator.share({ title: 'Pas de ça à table', text, url }) } catch {} return }
  try { await navigator.clipboard.writeText(url); toast('Lien copié.') } catch { toast(url) }
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'create': {
      const name = val('c-name');
      if (!name) return toast('Choisis un pseudo.');
      return enter(() => rpc('create_room', { p_name: name, p_target: +val('c-target') }), name);
    }
    case 'join': {
      const code = val('j-code').toUpperCase(), name = val('j-name');
      if (code.length !== 4) return toast('Le code fait 4 caractères.');
      if (!name) return toast('Choisis un pseudo.');
      return enter(() => rpc('join_room', { p_code: code, p_name: name }), name);
    }
    case 'select': selected = +id; return render();
    case 'submit': if (selected && await act('submit_answer', { p_answer_id: selected })) { selected = null; render() } return;
    case 'pick': picked = id; return render();
    case 'confirm': if (picked) await act('pick_winner', { p_submission_id: picked }); return;
    case 'start': return act('start_game');
    case 'skip': return act('skip_question');
    case 'force': return act('force_judging');
    case 'next': return act('next_round');
    case 'share': return share();
    case 'kick':
      if (confirm(`Retirer ${P(id)?.name || 'ce joueur'} de la partie ?`)) await act('kick_player', { p_player_id: id });
      return;
    case 'leave':
      if (!confirm('Quitter la partie ?')) return;
      try { await rpc('leave_room', { p_code: session.code, p_token: session.token }); ping() } catch {}
      return leaveLocal();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('#c-name')) document.querySelector('[data-act=create]').click();
  if (e.key === 'Enter' && e.target.matches('#j-name, #j-code')) document.querySelector('[data-act=join]').click();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(true) });

const urlCode = (new URLSearchParams(location.search).get('code') || '').toUpperCase();
if (session && urlCode && urlCode !== session.code) save(null);
session ? startSession() : render();
</script>
</body>
</html>
