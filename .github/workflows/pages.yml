name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Full PostgreSQL + Chromium regression runs independently in CI on main.
  # Pages only rechecks the shipped frontend; re-running the entire suite here
  # delayed deployment even after an approved, already-tested PR.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend sanity checks
        run: node tests/sanity.mjs
      - name: Régressions réseau multijoueur
        run: node tests/reseau.mjs
      - name: Sécurité des salons
        run: node tests/securite-salon.mjs
      - name: QCM AS Grinta et animateur
        run: node tests/grinta_quiz_client.mjs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Vendor Supabase client
        run: |
          mkdir -p vendor
          if [ ! -s vendor/supabase.js ]; then
            curl --fail --silent --show-error --location --retry 3 \
              'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js' \
              -o vendor/supabase.js
          fi
          test -s vendor/supabase.js
      - name: Prepare self-contained site without modifying main
        run: |
          # A push from inside the Pages job retriggers the workflow and may
          # cancel the deployment before the new files reach the live site.
          sed -i 's#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js#./vendor/supabase.js#g' index.html
          grep -q './vendor/supabase.js' index.html
      - name: Build self-contained site
        run: |
          mkdir -p _site/vendor
          cp index.html _site/index.html
          cp vendor/supabase.js _site/vendor/supabase.js
          cp sw.js manifest.webmanifest logo.svg favicon-32.png icon-180.png icon-192.png icon-512.png _site/
          cp -r games _site/games
          cp -r css js dico design-studio _site/
          # Le quiz événementiel a son propre chemin /grinta-quiz/.
          # Sans cette copie, la PR est fusionnée mais GitHub Pages renvoie 404.
          cp -r grinta-quiz _site/grinta-quiz
          for f in index.html style.css app.js; do
            test -s "_site/grinta-quiz/$f" || { echo "manquant dans _site : grinta-quiz/$f"; exit 1; }
          done
          # Fail the deployment when the tested Grinta changes are absent.
          grep -q "presenter-atlas.png" _site/grinta-quiz/style.css
          test -s _site/grinta-quiz/presenter-atlas.png
          test -s _site/grinta-quiz/as-grinta-crest.webp
          grep -q 'as-grinta-crest.webp' _site/grinta-quiz/index.html
          ! grep -q "data:image/webp;base64" _site/grinta-quiz/style.css
          grep -q "presenter-shot" _site/grinta-quiz/app.js
          grep -q "asgq_rehearsal_add_bot" _site/grinta-quiz/app.js
          test -s _site/dico/index.json || { echo 'manquant dans _site : dico/index.json'; exit 1; }
          # Les ressources de la maquette 2 doivent être publiées avec le CSS.
          for f in logo-officiel.webp parchment.webp plum-painted.webp; do
            test -s "_site/design-studio/$f" || { echo "manquant dans _site : design-studio/$f"; exit 1; }
          done
          grep -q './vendor/supabase.js' _site/index.html
          for f in sw.js manifest.webmanifest logo.svg favicon-32.png icon-180.png icon-192.png icon-512.png; do
            test -s "_site/$f" || { echo "manquant dans _site : $f"; exit 1; }
          done
          # chaque script et feuille de style cité par la page doit être publié
          for f in $(grep -oE '(src|href)="(js|css)/[^"]+"' index.html | cut -d'"' -f2); do
            test -s "_site/$f" || { echo "manquant dans _site : $f"; exit 1; }
          done
          for g in white-home.jpg mimes.jpg white.svg; do
            test -s "_site/games/$g" || { echo "manquant dans _site : games/$g"; exit 1; }
          done
          for g in phrases priorites ondes bac dico qcm; do
            test -s "_site/games/$g.webp" || { echo "manquant dans _site : games/$g.webp"; exit 1; }
          done
          # Chaque script et feuille de style change d'adresse (?v=…) à chaque
          # mise en ligne, pour ne jamais mélanger ancien et nouveau code.
          V="${GITHUB_SHA::12}"
          sed -i -E "s#((src|href)=\"(js|css)/[^\"?]+)\"#\1?v=$V\"#g" _site/index.html
          grep -q "js/core.js?v=$V" _site/index.html
          grep -q "css/app.css?v=$V" _site/index.html
          # Force a fresh Grinta script and CSS on each release, just like the homepage.
          sed -i "s#href=\"./style.css\"#href=\"./style.css?v=$V\"#" _site/grinta-quiz/index.html
          sed -i "s#src=\"./app.js\"#src=\"./app.js?v=$V\"#" _site/grinta-quiz/index.html
          grep -q "app.js?v=$V" _site/grinta-quiz/index.html
          grep -q "style.css?v=$V" _site/grinta-quiz/index.html
          printf '{"revision":"%s","quiz":"grand-quiz-as-grinta","presenter":true,"manual_bots":true}\n' "$GITHUB_SHA" > _site/release-info.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published quiz assets match this release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REVISION: ${{ github.sha }}
        run: |
          # Pages may also publish a branch-based build without release-info.json.
          # Compare actual public quiz JS and CSS byte-for-byte instead.
          BASE="${PAGE_URL%/}"
          for i in $(seq 1 15); do
            if curl -fsSL --max-time 12 -H 'Cache-Control: no-cache' \
              "$BASE/grinta-quiz/app.js?revision=$REVISION&attempt=$i" -o "$RUNNER_TEMP/asgq-live-app.js" \
              && curl -fsSL --max-time 12 -H 'Cache-Control: no-cache' \
              "$BASE/grinta-quiz/style.css?revision=$REVISION&attempt=$i" -o "$RUNNER_TEMP/asgq-live-style.css" \
              && cmp -s _site/grinta-quiz/app.js "$RUNNER_TEMP/asgq-live-app.js" \
              && cmp -s _site/grinta-quiz/style.css "$RUNNER_TEMP/asgq-live-style.css"; then
              echo "Verified public Grinta quiz assets for $REVISION at $BASE"
              exit 0
            fi
            echo "Attempt $i: public Grinta JS/CSS do not yet match $REVISION"
            sleep 5
          done
          echo "::error::GitHub Pages did not serve the matching Grinta JS and CSS after deployment"
          exit 1
