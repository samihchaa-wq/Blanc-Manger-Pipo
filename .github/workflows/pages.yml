name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend sanity checks
        run: node tests/sanity.mjs
      - name: Régressions réseau multijoueur
        run: node tests/reseau.mjs
      - name: Huit clients réseau indépendants
        run: node tests/reseau-multiclient.mjs
      - name: Couverture QA des neuf jeux
        run: node tests/qa-suites.mjs
      - name: Victoire commune Mr White et Imposteur
        run: node tests/white-alliance.mjs
      - name: Sécurité des salons
        run: node tests/securite-salon.mjs
      - name: Invitations sécurisées
        run: node tests/codes-salons.mjs
      - name: Exposition minimale des RPC
        run: node tests/security-rpcs.mjs
      - name: PostgreSQL — scénario complet de limitation
        run: |
          cat tests/sql/room_join_stub.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat supabase/migrations/20261114120000_room_join_rate_limits.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat supabase/tests/room_join_rate_limits_scenario.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat supabase/migrations/20261115120000_secure_eight_digit_room_codes.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat supabase/tests/room_codes_eight_digits_scenario.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat tests/sql/legacy_rpc_stub.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat supabase/migrations/20261116120000_revoke_legacy_public_rpcs.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat supabase/tests/security_legacy_rpc_grants_scenario.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat tests/sql/rpc_auth_stub.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat supabase/migrations/20261117120000_rpc_auth_and_vote_integrity.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat supabase/tests/rpc_auth_vote_integrity_scenario.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat supabase/migrations/20261118120000_restore_dico_dilemme_revotes.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat supabase/tests/qa_revotes_postgres_stub.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
      - name: Vrais votes simultanés sur PostgreSQL isolé
        run: |
          cat tests/sql/concurrency_fixtures.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          bash tests/sql/check_concurrency.sh "${{ job.services.postgres.id }}"
      - name: Grand Quiz AS Grinta — intégrité et confidentialité
        run: node tests/grinta_quiz_client.mjs
      - name: Grand Quiz AS Grinta — parcours complet PostgreSQL
        run: bash tests/sql/grinta_quiz_schema.sh "${{ job.services.postgres.id }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer le navigateur de test
        run: python -m pip install playwright==1.56.0
      - name: Parcours Chromium sur les neuf jeux
        run: python tests/qa_browser.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: qa-browser-captures
          path: test-results/browser/*.png
          if-no-files-found: ignore

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Vendor Supabase client
        run: |
          mkdir -p vendor
          if [ ! -s vendor/supabase.js ]; then
            curl --fail --silent --show-error --location --retry 3 \
              'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js' \
              -o vendor/supabase.js
          fi
          test -s vendor/supabase.js
      - name: Make branch deployment self-contained
        run: |
          sed -i 's#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js#./vendor/supabase.js#g' index.html
          grep -q './vendor/supabase.js' index.html
          if ! git diff --quiet -- index.html vendor/supabase.js || ! git ls-files --error-unmatch vendor/supabase.js >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html vendor/supabase.js
            git commit -m 'Use local Supabase client on published site'
            git push
          fi
      - name: Build self-contained site
        run: |
          mkdir -p _site/vendor
          cp index.html _site/index.html
          cp vendor/supabase.js _site/vendor/supabase.js
          cp sw.js manifest.webmanifest logo.svg favicon-32.png icon-180.png icon-192.png icon-512.png _site/
          cp -r games _site/games
          cp -r css js dico design-studio _site/
          # Le quiz événementiel a son propre chemin /grinta-quiz/.
          # Sans cette copie, la PR est fusionnée mais GitHub Pages renvoie 404.
          cp -r grinta-quiz _site/grinta-quiz
          for f in index.html style.css app.js; do
            test -s "_site/grinta-quiz/$f" || { echo "manquant dans _site : grinta-quiz/$f"; exit 1; }
          done
          test -s _site/dico/index.json || { echo 'manquant dans _site : dico/index.json'; exit 1; }
          # Les ressources de la maquette 2 doivent être publiées avec le CSS.
          for f in logo-officiel.webp parchment.webp plum-painted.webp; do
            test -s "_site/design-studio/$f" || { echo "manquant dans _site : design-studio/$f"; exit 1; }
          done
          grep -q './vendor/supabase.js' _site/index.html
          for f in sw.js manifest.webmanifest logo.svg favicon-32.png icon-180.png icon-192.png icon-512.png; do
            test -s "_site/$f" || { echo "manquant dans _site : $f"; exit 1; }
          done
          # chaque script et feuille de style cité par la page doit être publié
          for f in $(grep -oE '(src|href)="(js|css)/[^"]+"' index.html | cut -d'"' -f2); do
            test -s "_site/$f" || { echo "manquant dans _site : $f"; exit 1; }
          done
          for g in white-home.jpg mimes.jpg white.svg; do
            test -s "_site/games/$g" || { echo "manquant dans _site : games/$g"; exit 1; }
          done
          for g in phrases priorites ondes bac dico qcm; do
            test -s "_site/games/$g.webp" || { echo "manquant dans _site : games/$g.webp"; exit 1; }
          done
          # Chaque script et feuille de style change d'adresse (?v=…) à chaque
          # mise en ligne, pour ne jamais mélanger ancien et nouveau code.
          V="${GITHUB_SHA::12}"
          sed -i -E "s#((src|href)=\"(js|css)/[^\"?]+)\"#\1?v=$V\"#g" _site/index.html
          grep -q "js/core.js?v=$V" _site/index.html
          grep -q "css/app.css?v=$V" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
