name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/sanity.mjs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Vendor Supabase client
        run: |
          mkdir -p vendor
          if [ ! -s vendor/supabase.js ]; then
            curl --fail --silent --show-error --location --retry 3 \
              'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js' \
              -o vendor/supabase.js
          fi
          test -s vendor/supabase.js
      - name: Make branch deployment self-contained
        run: |
          sed -i 's#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js#./vendor/supabase.js#g' index.html
          grep -q './vendor/supabase.js' index.html
          if ! git diff --quiet -- index.html vendor/supabase.js || ! git ls-files --error-unmatch vendor/supabase.js >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html vendor/supabase.js
            git commit -m 'Use local Supabase client on published site'
            git push
          fi
      - name: Build self-contained site
        run: |
          mkdir -p _site/vendor
          cp index.html _site/index.html
          cp vendor/supabase.js _site/vendor/supabase.js
          cp manifest.webmanifest favicon-32.png icon-180.png icon-192.png icon-512.png _site/
          grep -q './vendor/supabase.js' _site/index.html
          for f in manifest.webmanifest favicon-32.png icon-180.png icon-192.png icon-512.png; do
            test -s "_site/$f" || { echo "manquant dans _site : $f"; exit 1; }
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
