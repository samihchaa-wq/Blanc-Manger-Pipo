name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend sanity checks
        run: node tests/sanity.mjs
      - name: Régressions réseau multijoueur
        run: node tests/reseau.mjs
      - name: Huit clients réseau indépendants
        run: node tests/reseau-multiclient.mjs
      - name: Couverture QA des huit jeux
        run: node tests/qa-suites.mjs
      - name: Victoire commune Mr White et Imposteur
        run: node tests/white-alliance.mjs
      - name: Sécurité des salons
        run: node tests/securite-salon.mjs
      - name: Invitations sécurisées
        run: node tests/codes-salons.mjs
      - name: Exposition minimale des RPC
        run: node tests/security-rpcs.mjs
      - name: PostgreSQL — scénario complet de limitation
        run: |
          cat tests/sql/room_join_stub.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat supabase/migrations/20261114120000_room_join_rate_limits.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat supabase/tests/room_join_rate_limits_scenario.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat supabase/migrations/20261115120000_secure_eight_digit_room_codes.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat supabase/tests/room_codes_eight_digits_scenario.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat tests/sql/legacy_rpc_stub.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat supabase/migrations/20261116120000_revoke_legacy_public_rpcs.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat supabase/tests/security_legacy_rpc_grants_scenario.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat tests/sql/rpc_auth_stub.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat supabase/migrations/20261117120000_rpc_auth_and_vote_integrity.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat supabase/tests/rpc_auth_vote_integrity_scenario.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat supabase/migrations/20261118120000_restore_dico_dilemme_revotes.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          cat supabase/tests/qa_revotes_postgres_stub.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
      - name: Vrais votes simultanés sur PostgreSQL isolé
        run: |
          cat tests/sql/concurrency_fixtures.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1
          bash tests/sql/check_concurrency.sh "${{ job.services.postgres.id }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer le navigateur de test
        run: python -m pip install playwright==1.56.0
      - name: Parcours Chromium sur les huit jeux
        run: python tests/qa_browser.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: qa-browser-captures
          path: test-results/browser/*.png
          if-no-files-found: ignore
