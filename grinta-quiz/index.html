<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071628">
  <meta name="description" content="Le Grand Quiz AS Grinta 2026, une soirée, deux mi-temps, un champion.">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="color-scheme" content="dark">
  <title>Grand Quiz AS Grinta 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script defer src="../vendor/supabase.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div class="stadium-glow" aria-hidden="true"></div>
  <div class="shell">
    <header class="brand" aria-label="AS Grinta">
      <div class="crest crest-authentic"><img src="./as-grinta-crest.webp" width="48" height="54" alt="Écusson officiel AS Grinta"></div>
      <div class="brand-wordmark"><span>AS GRINTA</span><small>LE GRAND QUIZ · 2026</small></div>
      <a class="brand-back" href="../" aria-label="Quitter le quiz et revenir aux jeux" title="Retour aux jeux">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </a>
    </header>
    <div id="network-status" role="status" aria-live="polite" hidden>Connexion interrompue. Reconnexion automatique en cours…</div>
    <div id="screen-announcement" class="visually-hidden" role="status" aria-live="polite"></div>
    <main id="app"><div class="loading"><div class="spinner" aria-hidden="true"></div><p>Connexion au vestiaire…</p></div></main>
  </div>
  <div id="notice" role="status" aria-live="polite"></div>
</body>
</html>
