  <!-- Le cœur incandescent du néon du titre : la lumière au milieu des lettres,
       et rien d'autre. La page le superpose à logo.svg et fait varier son
       opacité — c'est ce qui fait respirer le néon. Même tracé que logo.svg, à
       l'arrondi près : le dessin est flouté puis seuillé, le détail fin n'y
       survivrait pas. Si le logo change, ce fichier doit suivre.

       Comment la lumière reste DANS les lettres : on floute la silhouette, ce
       qui donne un dégradé qui vaut 1 au cœur des pleins et tombe à 0 sur les
       bords, puis on ne garde que le haut de ce dégradé. La lumière naît donc
       loin des bords et n'a aucun moyen de les franchir ; le feComposite final
       la rabat de toute façon dans la silhouette. Un pixel de lueur au-delà du
       tracé se lirait comme un flou sur un titre de cette taille.
       Le seuillage remplace un erode, que Chrome rend vide au-delà d'un petit
       rayon. Tout est en unités du viewBox : le rendu est le même à toutes les
       tailles d'écran, contrairement à un filtre CSS posé sur l'image. -->
